<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Twenty Shades of Angel — For Jackie</title>
<style>
:root{--bg:#09090b;--panel:#121216;--panel2:#18181d;--text:#f7f1f3;--muted:#b9adb2;--accent:#a50f2d;--accent2:#e04768;--line:#30252a;--ok:#d9b8c1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#261017 0,#0d0d10 35%,#070708 100%);color:var(--text);font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;padding:22px}.app{width:min(720px,100%)}.card{background:linear-gradient(180deg,rgba(24,24,29,.96),rgba(12,12,15,.98));border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,42px);box-shadow:0 25px 80px rgba(0,0,0,.55)}.eyebrow{text-transform:uppercase;letter-spacing:.22em;color:var(--accent2);font:700 12px Arial,sans-serif}.title{font-size:clamp(34px,7vw,58px);line-height:1.02;margin:12px 0 14px}.sub{color:var(--muted);font:16px/1.65 Arial,sans-serif}.rule{border-left:3px solid var(--accent);padding:10px 14px;margin:10px 0;background:#ffffff05;font:14px/1.45 Arial,sans-serif}.actions{display:grid;gap:11px;margin-top:25px}.btn{width:100%;border:1px solid #4b3038;background:#1a1417;color:#fff;padding:15px 17px;border-radius:13px;cursor:pointer;text-align:left;font:600 15px/1.35 Arial,sans-serif;transition:.18s}.btn:hover{transform:translateY(-1px);border-color:var(--accent2);background:#24161b}.btn.primary{text-align:center;background:linear-gradient(135deg,#7e0d26,#bd183b);border:none}.btn.ghost{text-align:center;background:#111114}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px;font:700 11px Arial,sans-serif;letter-spacing:.15em;color:var(--muted)}.progress{height:5px;background:#282127;border-radius:99px;overflow:hidden;margin-bottom:26px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.35s}.q{font-size:clamp(24px,5vw,34px);line-height:1.22;margin:8px 0 24px}.reaction{min-height:24px;color:var(--ok);font:italic 15px Arial,sans-serif;margin-top:15px}.small{font:13px/1.5 Arial,sans-serif;color:var(--muted)}.hidden{display:none!important}.checks label{display:block;border:1px solid #4b3038;padding:14px;border-radius:12px;margin:9px 0;font:15px Arial,sans-serif;cursor:pointer}.checks input{margin-right:10px}.textarea{width:100%;min-height:115px;background:#0d0d10;border:1px solid #49323a;border-radius:12px;color:white;padding:14px;font:15px/1.5 Arial,sans-serif;resize:vertical}.notice{background:#180f13;border:1px solid #522331;border-radius:13px;padding:14px;margin:20px 0;color:#e8cbd3;font:14px/1.5 Arial,sans-serif}.heart{text-align:center;font-size:46px;margin:8px}.final{text-align:center}.final p{font:16px/1.7 Arial,sans-serif;color:#d7ccd0}.status{font:13px Arial,sans-serif;color:#cdbbc1;margin-top:12px}.adminlink{opacity:.4;text-align:center;margin-top:12px;font:11px Arial,sans-serif;color:#aaa}
</style>
</head><body><main class="app"><section class="card" id="card"></section><div class="adminlink">Made for Jackie, by Angel ❤️</div></main>
<script>
// After deploying your Cloudflare Worker, paste its public URL below (no trailing slash).
const API_BASE = "https://jackie-puzzle-api.jayjacobs.workers.dev";
const questions=[
["When you finally see Angel standing in front of you for the first time, what do you think you'll want to do first?",["Hug him immediately ❤️","Just stare at him for a few seconds","Smile like an idiot and forget what I wanted to say 😂","Make him come to me 😏"]],
["What are you most curious to discover about Angel in person?",["His voice","His smell","The way he looks at me","What it feels like simply being close to him"]],
["Imagine our first proper hug. What do you think you'll do?",["Keep it sweet and quick","Hold on a little longer than necessary","Bury my face against him ❤️","I'm not planning on letting go 😏"]],
["If Angel is nervous when we first meet, what would you do?",["Hold his hand","Hug him","Tease him until he relaxes 😂","Whisper, ‘You wanted this… remember?’ 😏"]],
["What do you think would make you most nervous when we're finally alone together?",["The silence","Eye contact","Sitting very close to each other","Knowing exactly what we're both thinking 😏"]],
["Where would you want our first kiss to happen?",["Somewhere romantic","Somewhere completely ordinary so the moment makes it special","Somewhere private","I don't care where. I've waited long enough. 😏"]],
["Who do you think should make the first move?",["Angel","Jackie","Whoever loses control first 😂","No planning. Let it happen naturally."]],
["If Angel moved closer to you but stopped just short of kissing you, what would you do?",["Wait for him","Close the distance myself","Whisper ‘What are you waiting for?’","Make him suffer for teasing me 😈"]],
["What would you most want Angel to notice about you when we meet?",["My eyes","My smile","The way I look at him","Everything. He better be paying attention. 😂"]],
["Which version of Angel are you most curious about meeting?",["Romantic Angel ❤️","Protective Angel","Mischievous Angel 😂","The Angel who stops behaving himself 😏"]],
["If we had an entire evening completely to ourselves, what sounds best?",["Dinner and hours of talking","A movie cuddled together","Music, drinks and no plans","Lock the door and see where the evening takes us 😏"]],
["What kind of affection do you think you'll enjoy most from Angel?",["Holding hands","Long hugs","Forehead kisses","Being pulled close unexpectedly ❤️‍🔥"]],
["What would make a quiet moment between us feel intimate to you?",["Holding hands without saying anything","Lying together and talking","Looking into each other's eyes","Being close enough that words aren't really necessary 😏"]],
["What do you think will surprise you most when we finally meet?",["How comfortable it feels","How nervous I am","How quickly the awkwardness disappears","How different it feels when Angel isn't behind a screen anymore ❤️"]],
["If Angel whispered something in your ear, what would you WANT him to say?",["I've waited a long time for this.","You're even more beautiful standing here.","Come closer.","Now you're in trouble. 😈"]],
["IMPORTANT COMPATIBILITY TEST: We finally meet and a ferret walks into the room. What happens? 😂",["Romantic moment immediately abandoned. FERRET! 😂","Ferret joins the cuddle","Angel gets five more minutes before I investigate the ferret","What romantic moment? Did you say FERRET?! 🦦"]],
["What are you most looking forward to about not having a screen between us?",["Seeing your expressions properly","Being able to reach for your hand","Actually being able to hug you","Discovering whether all this chemistry survives being in the same room ❤️"]],
["When that first meeting eventually ends and we have to say goodbye, what do you think will be hardest?",["Letting go of the last hug","Watching you leave","Going back to messages instead of having you there","I'm already demanding the date of meeting number two. ❤️"]],
["Forget the flirting for one question. What do you most want to feel when you're finally with Angel?",["Safe","Comfortable","Loved","Like I can completely be myself"],true],
["After all the messages, teasing, ridiculous pranks, ferrets, late-night conversations and everything between us… what do you want our first meeting to be?",["The beginning of something real ❤️","The first of many","A day neither of us ever forgets","All of the above ❤️‍🔥"]]
];
let i=0,answers=[],started=new Date().toISOString(); const card=document.getElementById('card');
const reactions=["Interesting, Miss Jackie… 😏","Angel will remember that.","Oh really? We'll see about that. 😈","That answer may come back to haunt you. 😂","❤️ I was secretly hoping you'd choose that."];
function intro(){card.innerHTML=`<div class="eyebrow">Private & Confidential</div><h1 class="title">Twenty Shades<br>of Angel</h1><p class="sub">For Jackie only. Yesterday you proved how well you know your lover. Tonight, knowing him isn't enough. Tonight… you have choices to make. 😏</p><div class="notice">🔒 <b>PRIVATE:</b> Your answers will be sent to Angel. Choose carefully, Miss Jackie. He <i>will</i> see them. 😈</div><div class="rule">RULE #1 — Answer honestly.</div><div class="rule">RULE #2 — Once you start, you finish.</div><div class="rule">RULE #3 — What happens in this puzzle stays between Jackie and Angel.</div><div class="actions"><button class="btn primary" onclick="showQ()">I ACCEPT 🖤</button><button class="btn ghost" onclick="scared()">I'M SCARED 😳</button></div>`}
function scared(){card.innerHTML=`<div class="heart">😈</div><h2 class="q" style="text-align:center">Excellent.<br>That means it's working.</h2><div class="actions"><button class="btn primary" onclick="showQ()">FINE. I ACCEPT 🖤</button></div>`}
function showQ(){const q=questions[i],pct=(i/20)*100;card.innerHTML=`<div class="top"><span>CONFESSION ${String(i+1).padStart(2,'0')} / 20</span><span>JACKIE × ANGEL</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="eyebrow">Choose honestly</div><h2 class="q">${q[0]}</h2>${q[2]?multi(q[1]):buttons(q[1])}<div id="reaction" class="reaction"></div>`}
function buttons(opts){return `<div class="actions">${opts.map((x,n)=>`<button class="btn" onclick="choose(${n})">${String.fromCharCode(65+n)}. ${x}</button>`).join('')}</div>`}
function multi(opts){return `<p class="small">For this one, you're allowed to be greedy. Choose as many as you want. ❤️</p><div class="checks">${opts.map((x,n)=>`<label><input type="checkbox" value="${n}"> ${x}</label>`).join('')}</div><div class="actions"><button class="btn primary" onclick="chooseMulti()">LOCK IN MY ANSWERS ❤️</button></div>`}
function choose(n){const q=questions[i];answers.push({number:i+1,question:q[0],answer:q[1][n]});advance()}
function chooseMulti(){const checked=[...document.querySelectorAll('input:checked')].map(x=>questions[i][1][+x.value]);if(!checked.length){document.getElementById('reaction').textContent='Nice try, Miss Jackie. Pick at least one. 😏';return}answers.push({number:i+1,question:questions[i][0],answer:checked.join(' + ')});advance()}
function advance(){const r=document.getElementById('reaction');r.textContent=reactions[i%reactions.length];document.querySelectorAll('button,input').forEach(x=>x.disabled=true);setTimeout(()=>{i++;i<20?showQ():askHer()},650)}
function askHer(){card.innerHTML=`<div class="top"><span>20 / 20 COMPLETE</span><span>YOUR TURN</span></div><div class="progress"><div class="bar" style="width:100%"></div></div><div class="eyebrow">Two questions. No restrictions.</div><h2 class="q">Now Jackie gets to interrogate Angel. 😏</h2><p class="sub">Romantic, serious, ridiculous, naughty, terrifying… ask me any <b>two</b> things you want. I promise to answer honestly. ❤️</p><label class="small">QUESTION FOR ANGEL #1</label><textarea id="a1" class="textarea" placeholder="Ask Angel anything…"></textarea><br><br><label class="small">QUESTION FOR ANGEL #2</label><textarea id="a2" class="textarea" placeholder="And one more… 😈"></textarea><div class="actions"><button class="btn primary" onclick="finish()">SEND BOTH TO ANGEL ❤️</button></div><div id="status" class="status"></div>`}
async function finish(){const a1=document.getElementById('a1').value.trim(),a2=document.getElementById('a2').value.trim(),s=document.getElementById('status');if(!a1||!a2){s.textContent='Two questions means two questions, Miss Jackie. 😏';return}const payload={player_name:'Jackie',started_at:started,completed_at:new Date().toISOString(),answers,question_1:a1,question_2:a2};localStorage.setItem('jackieTwentyShades',JSON.stringify(payload));s.textContent='Sealing your confessions… ❤️';if(API_BASE.startsWith('http')){try{const res=await fetch(API_BASE+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw new Error();}catch(e){s.textContent='Saved on this device, but the message to Angel could not be delivered. Please tell him. ❤️';return}}else{s.textContent='Saved on this device. Angel still needs to connect the private mailbox. ❤️';}setTimeout(finalScreen,700)}
function finalScreen(){card.innerHTML=`<div class="final"><div class="eyebrow">Confessions Complete</div><div class="heart">❤️</div><h1 class="title">No more questions,<br>Jackie.</h1><p>There are some things a screen simply can't answer.</p><p>I don't know exactly what our first hug will feel like.<br>I don't know who will be more nervous.<br>I don't know who will make the first move.</p><p>And I don't want a computer to decide any of that for us.</p><p><b>I want to discover it with you.</b> ❤️</p><p>Until then, I'll just have to keep making you wonder. 😈</p><p><b>— Angel</b></p><p class="small">P.S. If a ferret interrupts our first kiss, I'm blaming you. 😂</p></div>`}
intro();
</script></body></html>
